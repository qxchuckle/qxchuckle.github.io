# 本地产物投递轨：源码仓 `pnpm cli` 选「本地产物」时，把构建好的 out/ force-push
# 到 dist 分支，这里负责把它交给 Pages。不 checkout 源码、不构建。
#
# 真源在 qcqx-blog-next/.github/pages-dist-workflow.yml，改完跑
# scripts/sync-pages-workflow.sh 同步过来。
#
# 与 pages.yml（源码重建）共用 concurrency group `pages`，两条路不会互相踩；
# 谁后跑完谁生效。
#
# dist 分支的内容就是站点根，但 Actions 要求 workflow 定义存在于被 push 的分支上，
# 所以那份 .github/ 得在上传前删掉。

name: Pages (local products)

on:
  push:
    branches: [dist]

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # 完整门禁在源码仓投递前就跑过了（build/lib/pages-products.ts）。这里只守
      # 三条「一旦不对就毁掉整条轨」的线：自定义域、站点形状、自包含前缀。
      - name: 断言产物形状
        run: |
          set -eu
          rm -rf .github
          : > .nojekyll

          if [ ! -f CNAME ]; then
            echo "::error::产物缺 CNAME；Pages 会把自定义域清空，境外全线 404"
            exit 1
          fi
          cname="$(cat CNAME)"
          if [ "$cname" != "www.qcqx.cn" ]; then
            echo "::error::CNAME 必须是单行 www.qcqx.cn，实际为「$cname」"
            exit 1
          fi

          test -f index.html || { echo "::error::缺 index.html"; exit 1; }
          test -f 404.html || { echo "::error::缺 404.html"; exit 1; }
          test -d _static || { echo "::error::缺 _static"; exit 1; }
          test -d pagefind || { echo "::error::缺 pagefind 索引"; exit 1; }
          test -n "$(find article -maxdepth 1 -name '*.html' -print -quit 2>/dev/null)" \
            || { echo "::error::文章未扁平化成 article/<slug>.html"; exit 1; }

          # 带 CDN 前缀的产物推上来，境外页面会跨域去国内取资源：慢，且依赖
          # EdgeOne 的 Referer 白名单放行。投递轨必须自包含。
          if grep -rlE --include='*.html' \
               'https://cdn\.qcqx\.cn/(_static|assets|pagefind|favicon\.ico)' . \
               | head -n 1 | grep -q .; then
            echo "::error::产物带 CDN 资源前缀，投递轨必须空前缀"
            exit 1
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
